# OUTDATED: do not regenerate the Xcode project from this file.
# MacDM.xcodeproj has been edited by hand since (test target, signing, deployment target 14.0).
# Kept only for reference. See docs/DEVELOPMENT.md.

name: MacDM
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    macOS: "13.0"

targets:
  MacDM:
    type: application
    platform: macOS
    sources:
      - path: MacDM
    dependencies:
      - target: SafariExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.MacDM
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: MacDM/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    entitlements:
      path: MacDM/MacDM.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true

  SafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: SafariExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.MacDM.SafariExtension
        INFOPLIST_FILE: SafariExtension/Info.plist
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    entitlements:
      path: SafariExtension/SafariExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

schemes:
  MacDM:
    build:
      targets:
        MacDM: all
        SafariExtension: all
    run:
      config: Debug
